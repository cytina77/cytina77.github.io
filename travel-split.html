<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分帳工具測試版</title>
<style>
body { font-family: Arial; max-width:600px; margin:auto; padding:10px; }
.card { border:1px solid #ccc; border-radius:8px; padding:10px; margin:10px 0; background:#f9f9f9; }
button { padding:5px 10px; margin-left:5px; cursor:pointer; }
</style>
</head>
<body>
<h1>分帳工具測試版</h1>

<!-- 新增活動 -->
<div class="card">
<input id="newEventName" placeholder="輸入活動名稱">
<button id="addEventBtn">新增活動</button>
</div>

<!-- 活動列表 -->
<div id="eventsContainer"></div>

<script>
// 確保 JS 等網頁元素載入完才綁定事件
document.addEventListener("DOMContentLoaded", function(){

    // 初始化事件資料
    let events = JSON.parse(localStorage.getItem("events") || "{}");
    let currentEvent = null;

    // 綁定按鈕
    document.getElementById("addEventBtn").addEventListener("click", createEvent);

    // 新增活動
    function createEvent(){
        const name = document.getElementById("newEventName").value.trim();
        if(!name){ alert("請輸入活動名稱"); return; }
        if(events[name]){ alert("活動已存在"); return; }
        events[name] = { expenses: [] };
        currentEvent = name;
        document.getElementById("newEventName").value = "";
        saveEvents();
        renderEvents();
    }

    // 顯示活動列表
    function renderEvents(){
        const container = document.getElementById("eventsContainer");
        container.innerHTML = "";
        for(const name in events){
            const div = document.createElement("div");
            div.className = "card";
            div.innerHTML = `<strong>${name}</strong>
            <button onclick="selectEvent('${name}')">進入</button>`;
            container.appendChild(div);
        }
    }

    // 選擇活動
    window.selectEvent = function(name){
        currentEvent = name;
        alert("已選擇活動：" + name);
    }

    // 儲存資料到 localStorage
    function saveEvents(){
        localStorage.setItem("events", JSON.stringify(events));
    }

    // 初始渲染
    renderEvents();
});
</script>
</body>
</html>
